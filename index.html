<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruediger's Apps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1d1d1f;
      --subtext: #6e6e73;
      --accent: #0071e3;
      --border: rgba(0,0,0,0.08);
      --shadow: 0 2px 16px rgba(0,0,0,0.08);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.14);
      --modal-bg: rgba(0,0,0,0.45);
      --radius: 18px;
      --icon-radius: 22.37%; /* Apple's icon corner radius */
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card-bg: #2c2c2e;
        --text: #f5f5f7;
        --subtext: #98989d;
        --border: rgba(255,255,255,0.08);
        --shadow: 0 2px 16px rgba(0,0,0,0.4);
        --shadow-hover: 0 8px 32px rgba(0,0,0,0.5);
        --modal-bg: rgba(0,0,0,0.65);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 64px 24px 40px;
    }

    header h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
      color: var(--subtext);
    }

    .category-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--subtext);
      padding: 0 24px;
      max-width: 1200px;
      margin: 40px auto 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 24px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .card:active {
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: var(--icon-radius);
      overflow: hidden;
      background: var(--border);
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .icon-placeholder {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: var(--icon-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .card-meta h2 {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }

    .platform-tag {
      display: inline-block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0,113,227,0.1);
      border-radius: 4px;
      padding: 2px 7px;
    }

    .card-desc {
      font-size: 14px;
      line-height: 1.55;
      color: var(--subtext);
      flex: 1;
    }

    .card-cta {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    footer {
      text-align: center;
      padding: 60px 24px 40px;
      font-size: 13px;
      color: var(--subtext);
    }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 760px;
      max-height: 88vh;
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      transform: translateY(40px);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      scrollbar-width: thin;
    }

    .overlay.open .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 36px;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      margin: 12px auto 0;
    }

    .modal-close {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: flex-end;
      padding: 12px 20px 0;
      background: var(--card-bg);
      z-index: 1;
    }

    .modal-close button {
      background: var(--border);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 16px;
      cursor: pointer;
      color: var(--subtext);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .modal-close button:hover {
      background: rgba(0,0,0,0.15);
    }

    .modal-body {
      padding: 0 28px 40px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .modal-icon {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: var(--icon-radius);
      overflow: hidden;
      background: var(--border);
    }

    .modal-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-icon-placeholder {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: var(--icon-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
    }

    .modal-title h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .modal-title .platform-tag {
      font-size: 12px;
      margin-top: 5px;
    }

    .modal-tagline {
      font-size: 17px;
      color: var(--subtext);
      margin-bottom: 24px;
      font-style: italic;
    }

    .modal-section {
      margin-bottom: 24px;
    }

    .modal-section h3 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 10px;
    }

    .modal-section p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
    }

    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feature-list li {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      padding-left: 20px;
      position: relative;
    }

    .feature-list li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 11px;
      top: 3px;
    }

    .no-screenshots {
      background: var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--subtext);
    }

    .screenshot-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    .screenshot-strip img {
      height: 380px;
      width: auto;
      max-width: 85vw;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      flex-shrink: 0;
      scroll-snap-align: start;
      cursor: zoom-in;
      background: var(--border);
    }

    hr.divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 34px; }
      .grid { grid-template-columns: 1fr; }
      .modal { max-height: 92vh; border-radius: 20px 20px 0 0; }
      .modal-body { padding: 0 20px 32px; }
      .screenshot-strip img { height: 280px; }
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 40px;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.5);
      cursor: zoom-out;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.24);
    }
  </style>
</head>
<body>

<header>
  <h1>Ruediger&rsquo;s Apps</h1>
  <p>Native Swift apps for macOS &amp; iOS</p>
</header>

<div class="category-label">Audiobook &amp; Audio</div>
<div class="grid" id="grid-audio"></div>

<div class="category-label">AI &amp; Productivity</div>
<div class="grid" id="grid-ai"></div>

<div class="category-label">Finance &amp; Data</div>
<div class="grid" id="grid-finance"></div>

<div class="category-label">Home Automation &amp; Energy</div>
<div class="grid" id="grid-home"></div>

<div class="category-label">Networking &amp; Privacy</div>
<div class="grid" id="grid-networking"></div>

<div class="category-label">Health</div>
<div class="grid" id="grid-health"></div>

<footer>
  <p>All apps built with Swift &amp; SwiftUI &mdash; no external dependencies.</p>
</footer>

<!-- Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-close">
      <button id="closeBtn" aria-label="Close">✕</button>

</div>

  <button class="lightbox-close" id="lightboxCloseBtn" aria-label="Close">✕</button>

</div>

// ── Render cards ──
function renderCards() {
  const categoryMap = {
    audio: 'grid-audio',
    ai: 'grid-ai',
    finance: 'grid-finance',
    home: 'grid-home',
    networking: 'grid-networking',
    health: 'grid-health'
  };

  apps.forEach((app, index) => {
    if (app.hidden) return;
    const grid = document.getElementById(categoryMap[app.category]);
    if (!grid) return;

    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-index', index);

    const iconHTML = app.icon
      ? `<div class="icon-wrap"><img src="${app.icon}" alt="${app.name} icon" loading="lazy"></div>`
      : `<div class="icon-placeholder" style="background:${app.iconGradient}">${app.iconEmoji}</div>`;

    card.innerHTML = `
      <div class="card-top">
        ${iconHTML}
        <div class="card-meta">
          <h2>${app.name}</h2>
          <span class="platform-tag">${app.platform}</span>
        </div>
      </div>
      <p class="card-desc">${app.tagline}</p>
      <span class="card-cta">Learn more →</span>
    `;

    card.addEventListener('click', () => openModal(index));
    grid.appendChild(card);
  });
}

// ── Modal ──
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');
const closeBtn = document.getElementById('closeBtn');

function openModal(index) {
  const app = apps[index];

  const iconHTML = app.icon
    ? `<div class="modal-icon"><img src="${app.icon}" alt="${app.name} icon"></div>`
    : `<div class="modal-icon-placeholder" style="background:${app.iconGradient}">${app.iconEmoji}</div>`;

  const featuresHTML = app.features.map(f => `<li>${f}</li>`).join('');

  const screenshotsHTML = (app.screenshots && app.screenshots.length)
    ? `<div class="screenshot-strip">${app.screenshots.map(src =>
        `<img src="${src}" alt="${app.name} screenshot" loading="lazy" class="shot-thumb">`
      ).join('')}</div>`
    : `<div class="no-screenshots"><p>📸 Screenshots coming soon</p></div>`;

  modalBody.innerHTML = `
    <div class="modal-header">
      ${iconHTML}
      <div class="modal-title">
        <h2>${app.name}</h2>
        <span class="platform-tag">${app.platform}</span>
      </div>
    </div>
    <p class="modal-tagline">${app.tagline}</p>

    <div class="modal-section">
      <h3>Overview</h3>
      <p>${app.summary}</p>
    </div>

    <hr class="divider">

    <div class="modal-section">
      <h3>Screenshots</h3>
      ${screenshotsHTML}
    </div>

    <hr class="divider">

    <div class="modal-section">
      <h3>Features</h3>
      <ul class="feature-list">${featuresHTML}</ul>
    </div>

    <hr class="divider">

    <div class="modal-section">
      <h3>Technologies</h3>
      <p>${app.tech}</p>
    </div>
  `;

  modalBody.querySelectorAll('.shot-thumb').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.getAttribute('src')));
  });

  document.getElementById('modal').scrollTop = 0;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

// ── Lightbox ──
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxCloseBtn = document.getElementById('lightboxCloseBtn');

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}

lightboxCloseBtn.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox || e.target === lightboxImg) closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (lightbox.classList.contains('open')) closeLightbox();
  else closeModal();
});

renderCards();
</script>
